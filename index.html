function lockNow() { UI.locked = true; state.settings.docsLocked = true; save(); render(); toast('서류함을 잠갔어요.'); }
async function clearPin() {
  const ok = await askConfirm('PIN 없애기', '서류함 잠금을 없앨까요? 누구나 이 기기에서 서류함을 볼 수 있게 됩니다.', '없애기', true);
  if (!ok) return;
  state.settings.docPin = '';
  state.settings.docsLocked = false;
  UI.locked = false;
  save(); render(); toast('PIN을 없앴어요.');
}
function unlockDocs() {
  const v = formVal('pinInput');
  if (v === state.settings.docPin) {
    UI.locked = false;
    render();
    return;
  }
  const m = $('#pinMsg');
  if (m) m.textContent = 'PIN이 맞지 않아요.';
  const el = $('#pinInput'); if (el) el.value = '';
}
async function wipeAll() {
  const ok = await askConfirm('모든 기록 지우기', '이 기기의 기록 ' + state.records.length + '건·서류 ' + state.docs.length + '건이 지워집니다. 먼저 [전체 내보내기(ZIP)]로 백업해 두세요. 되돌릴 수 없어요.', '지우기', true);
  if (!ok) return;
  const ok2 = await askConfirm('정말 지울까요?', '가족 방에 올라간 기록은 남아 있어요(연결된 경우). 이 기기에서는 사라집니다.', '모두 지우기', true);
  if (!ok2) return;
  const prof = Object.assign({}, state.profile);
  state = defaults();
  state.profile = prof;
  save();
  go('home');
  toast('이 기기 기록을 모두 지웠어요.');
}

/* ---------- 동작 표 ---------- */
const ACT = {
  closeSheet,
  go(a) { go(a && a.dataset ? a.dataset.view : 'home'); },
  openQuick, openEdit, saveRecord,
  pickType(a) { FORM.type = a.dataset.type; const el = $('#fTypePick'); if (el) el.innerHTML = typePickHtml(); },
  pickHelped(a) { FORM.helped = a.dataset.help; const el = $('#fHelpPick'); if (el) el.innerHTML = helpedPickHtml(); },
  addTopic() {
    const el = $('#fTopicInput'); if (!el) return;
    const t = cleanTopic(el.value);
    if (!t) return;
    if (FORM.topics.map(x => x.toLowerCase()).indexOf(t.toLowerCase()) < 0 && FORM.topics.length < 10) FORM.topics.push(t);
    el.value = '';
    const box = $('#topicPick'); if (box) box.outerHTML = topicPickHtml();
  },
  addTopicName(a) {
    const t = cleanTopic(a.dataset.topic);
    if (t && FORM.topics.map(x => x.toLowerCase()).indexOf(t.toLowerCase()) < 0 && FORM.topics.length < 10) FORM.topics.push(t);
    const box = $('#topicPick'); if (box) box.outerHTML = topicPickHtml();
  },
  rmTopic(a) {
    const t = a.dataset.topic;
    FORM.topics = FORM.topics.filter(x => x !== t);
    const box = $('#topicPick'); if (box) box.outerHTML = topicPickHtml();
  },
  pickPhoto() {
    const inp = $('#hiddenFile'); inp.value = ''; inp.accept = 'image/*'; inp.multiple = true;
    inp.onchange = () => { attachPhotos(inp.files); inp.value = ''; };
    inp.click();
  },
  pickFile() {
    const inp = $('#hiddenFile'); inp.value = ''; inp.accept = ''; inp.multiple = true;
    inp.onchange = () => { attachFiles(inp.files); inp.value = ''; };
    inp.click();
  },
  recStart() { startRecording(); },
  recStop() { stopRecording(); },
  recAgain() {
    const last = FORM.media.filter(m => m.kind === 'audio').slice(-1)[0];
    if (last) removeMedia(last.id);
    startRecording();
  },
  rmMedia(a) { removeMedia(a.dataset.id); },
  addVersion(a) { openVersion(a.dataset.id); },
  saveVersion,
  openRecord(a) { openRecord(a.dataset.id); },
  openCompare(a) { openCompare(a.dataset.id); },
  editRecord(a) { openEdit(a.dataset.id); },
  async delRecord(a) {
    const r = state.records.find(x => x.id === a.dataset.id);
    if (!r) return;
    const ok = await askConfirm('기록 지우기', '“' + esc(recTitle(r)) + '” 기록과 이어쓰기 ' + arr(r.versions).length + '개가 지워집니다.', '지우기', true);
    if (!ok) return;
    state.deleted.records[r.id] = Date.now();
    state.records = state.records.filter(x => x.id !== r.id);
    save(); closeAllSheets(); render(); toast('기록을 지웠어요.');
  },
  async delVersion(a) {
    const r = state.records.find(x => x.id === a.dataset.id);
    if (!r) return;
    const ok = await askConfirm('이어쓰기 지우기', '이 이어쓰기 한 건만 지울까요?', '지우기', true);
    if (!ok) return;
    r.versions = arr(r.versions).filter(v => v.id !== a.dataset.ver);
    r.updatedAt = Date.now();
    save(); openRecord(r.id); toast('이어쓰기를 지웠어요.');
  },
  toggleFav(a) {
    const r = state.records.find(x => x.id === a.dataset.id);
    if (!r) return;
    r.fav = !r.fav; r.updatedAt = Date.now();
    save(); refreshList();
    const d = state.records.find(x => x.id === a.dataset.id);
    if (d && d.fav) toast('즐겨찾기에 넣었어요.');
  },
  toggleLater(a) {
    const r = state.records.find(x => x.id === a.dataset.id);
    if (!r) return;
    r.later = !r.later; r.updatedAt = Date.now();
    save(); refreshList();
    if (UI.view === 'home' && $('.overlay')) openRecord(r.id);
    toast(r.later ? '나중에 정리할 기록으로 표시했어요.' : '표시를 풀었어요.');
  },
  toggleType(a) {
    const t = a.dataset.type;
    const i = UI.types.indexOf(t);
    if (i >= 0) UI.types.splice(i, 1); else UI.types.push(t);
    refreshList();
  },
  toggleFavFilter() { UI.fav = !UI.fav; refreshList(); },
  toggleLaterFilter() { UI.later = !UI.later; refreshList(); },
  toggleAttach() { UI.attach = UI.attach === 'yes' ? 'all' : 'yes'; refreshList(); },
  resetFilters() {
    resetFilters();
    const q = $('#q'); if (q) q.value = '';
    refreshFilterChips();
  },
  openFilter,
  fltPeriod(a) { UI.period = a.dataset.v; refreshFilterChips(); },
  fltAge(a) { UI.ageRange = a.dataset.v; refreshFilterChips(); },
  fltType(a) {
    const t = a.dataset.v; const i = UI.types.indexOf(t);
    if (i >= 0) UI.types.splice(i, 1); else UI.types.push(t);
    refreshFilterChips();
  },
  fltTopic(a) {
    const t = a.dataset.v; const i = UI.topics.indexOf(t);
    if (i >= 0) UI.topics.splice(i, 1); else UI.topics.push(t);
    refreshFilterChips();
  },
  fltAttach(a) { UI.attach = a.dataset.v; refreshFilterChips(); },
  fltFav() { UI.fav = !UI.fav; refreshFilterChips(); },
  fltLater() { UI.later = !UI.later; refreshFilterChips(); },
  mvTab(a) { UI.mv = a.dataset.mv; render(); },
  periodMode(a) { UI.periodMode = a.dataset.mode; render(); },
  openTopic(a) { openTopic(a.dataset.topic); },
  openPeriod(a) { openPeriod(a.dataset.key); },
  renameTopic(a) { renameTopic(a.dataset.topic); },
  openCollection(a) {
    const pre = {};
    if (a && a.dataset.topic) pre.topic = a.dataset.topic;
    openCollection(pre);
  },
  collectionTopic(a) { openCollection({topic: a.dataset.topic}); },
  collectionPeriod(a) {
    const g = groupPeriods(UI.periodMode).find(x => x.key === a.dataset.key);
    if (!g) return;
    const dates = g.records.map(r => r.date).sort();
    openCollection({from: dates[0], to: dates[dates.length - 1]});
  },
  previewCollection, closePrint() { closePrint(); },
  printNow() { closePrint(); setTimeout(() => { try { window.print(); } catch (e) {} }, 80); },
  openDocForm(a) { openDocForm(a && a.dataset.id ? a.dataset.id : ''); },
  saveDoc(a) { saveDoc(a.dataset.id || ''); },
  openDoc(a) { openDoc(a.dataset.id); },
  editDoc(a) { openDocForm(a.dataset.id); },
  async delDoc(a) {
    const d = state.docs.find(x => x.id === a.dataset.id);
    if (!d) return;
    const ok = await askConfirm('서류 지우기', '“' + esc(d.name) + '” 서류와 첨부 ' + arr(d.media).length + '개를 지울까요?', '지우기', true);
    if (!ok) return;
    state.deleted.docs[d.id] = Date.now();
    state.docs = state.docs.filter(x => x.id !== d.id);
    save(); closeAllSheets(); render(); toast('서류를 지웠어요.');
  },
  unlockDocs() { unlockDocs(); },
  docStatus(a) { UI.docStatus = a.dataset.status; render(); },
  saveProfile, joinRoom, makeRoom, copyRoom, leaveRoom,
  pushNow() { pushRoomNow(); },
  pullNow() { window.GASync.downloadNow(); },
  setPin, lockNow, clearPin,
  exportZip() { exportZip(); },
  exportJson() { exportJson(); },
  importFile() { importFile(); },
  doMerge() { doMerge(); },
  doRestoreAll() { doRestoreAll(); },
  wipeAll() { wipeAll(); },
  goSettings() { go('settings'); },
};

/* ---------- 이벤트 ---------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const fn = ACT[a.dataset.act];
  if (!fn) return;
  e.preventDefault();
  e.stopPropagation();
  try { fn(a); } catch (err) { if (window.console) console.error(err); }
});
document.addEventListener('input', e => {
  if (e.target && e.target.id === 'q') {
    UI.q = e.target.value;
    refreshList();
  }
  if (e.target && e.target.id === 'docQ') {
    UI.docQ = e.target.value;
    const box = $('#docList');
    if (box) {
      const q = UI.docQ.trim().toLowerCase();
      const list = state.docs.slice().sort((a, b) => ((b.issuedAt || b.createdAt) > (a.issuedAt || a.createdAt) ? 1 : -1)).filter(d => {
        if (UI.docStatus !== 'all' && d.status !== UI.docStatus) return false;
        if (!q) return true;
        return [d.name, d.issuer, d.period, d.note, d.location].join(' ').toLowerCase().indexOf(q) >= 0;
      });
      box.innerHTML = list.length ? '<div class="period-list">' + list.map(docCardHtml).join('') + '</div>' : emptyBox('🍂', '조건에 맞는 서류가 없어요.');
    }
  }
});
document.addEventListener('keydown', e => {
  if (e.target && e.target.id === 'fTopicInput' && e.key === 'Enter') { e.preventDefault(); ACT.addTopic(); }
  if (e.target && e.target.id === 'pinInput' && e.key === 'Enter') { e.preventDefault(); unlockDocs(); }
  if (e.key === 'Enter' && e.target && e.target.classList && e.target.classList.contains('rcard')) {
    e.preventDefault();
    const id = e.target.dataset.id;
    if (id) openRecord(id);
  }
  if (e.key === 'Escape') {
    if ($('#printRoot').classList.contains('show')) closePrint();
    else if (sheetStack.length) closeSheet();
  }
});


/* ===== app6_boot.js ===== */
/* =====================================================================
   6. 시작 — 로컬 기록 불러오기, 가족 방 연결, 첫 화면
   ===================================================================== */
function boot() {
  loadLocal();
  Sync.device = deviceId();
  Sync.room = loadRoom();
  UI.locked = !!state.settings.docPin;
  render();
  if (Sync.room) connect();
  else setSyncStatus('local');
  UI.booted = true;
  /* 창을 다시 열었을 때 나이가 바뀌었으면 머리말만 갱신 */
  try {
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && UI.booted) {
        applyBrand();
        if (window.GASync && window.GASync.room && window.GASync.status === 'offline') window.GASync.connect();
      }
    });
  } catch (e) {}
}
window.__ga = {
  get state() { return state; },
  get UI() { return UI; },
  set state(v) { state = sanitize(v); },
  save, render, go, openQuick, openRecord, openVersion, openDoc, openDocForm,
  exportZip, exportJson, restoreFrom, doMerge, doRestoreAll,
  filteredRecords, groupPeriods, allTopics, collectionRecords, collectionHtml,
  sanitize, defaults, sync: () => window.GASync, FORM, rec: () => REC,
  version: APP_VERSION,
};
boot();
</script>
