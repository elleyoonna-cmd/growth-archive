<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBF6EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="성장 기록">
<title>우리집 성장 기록</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>/* ===================================================================
   우리집 성장 기록 — 스타일 (모바일 우선, PC 반응형)
   =================================================================== */
:root {
  --bg: #FBF6EE;
  --bg-2: #F4EDE2;
  --surface: #FFFFFF;
  --surface-2: #FFFDF9;
  --ink: #2B2A26;
  --ink-2: #6E685D;
  --ink-3: #9A9285;
  --line: #E9E0D2;
  --line-2: #F2EBDF;
  --accent: #2F6B5F;
  --accent-2: #3E8C7B;
  --accent-soft: #E4F0EC;
  --sun: #C98A2B;
  --sun-soft: #FBF0DA;
  --rose: #B85C4E;
  --rose-soft: #FAE9E5;
  --plum: #7A5A8C;
  --plum-soft: #F1EAF6;
  --blue: #41698C;
  --blue-soft: #E7EFF7;
  --shadow: 0 1px 2px rgba(43, 42, 38, .05), 0 8px 24px -12px rgba(43, 42, 38, .18);
  --shadow-lg: 0 18px 50px -18px rgba(43, 42, 38, .35);
  --r: 16px;
  --r-sm: 11px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --font: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, -apple-system, sans-serif;
  --serif: "Nanum Myeongjo", "Apple SD Gothic Neo", Georgia, serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
html { background: var(--bg); }
body {
  font-family: var(--font);
  color: var(--ink);
  background:
    radial-gradient(1200px 420px at 50% -140px, #F7EEDF 0%, transparent 70%),
    var(--bg);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
a { color: var(--accent); }
img { display: block; }
h1, h2, h3, h4 { margin: 0; font-weight: 800; letter-spacing: -.02em; }
p { margin: 0; }

#app { max-width: 760px; margin: 0 auto; padding: 0 14px 96px; }

/* ---------- 상단 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px 2px 10px;
  background: linear-gradient(var(--bg) 72%, rgba(251, 246, 238, .82) 100%);
  backdrop-filter: blur(8px);
}
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.brand-logo {
  width: 36px; height: 36px; flex: none;
  display: grid; place-items: center;
  background: var(--accent-soft); border-radius: 12px; font-size: 19px;
}
.brand-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.brand-text strong { font-size: 15px; letter-spacing: -.02em; }
.brand-text span {
  font-size: 11px; color: var(--ink-3); font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sync-pill {
  flex: none; font-size: 11px; font-weight: 800; color: var(--ink-2);
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 10px; white-space: nowrap;
}

/* ---------- 공통 ---------- */
.main { min-height: 60vh; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px; box-shadow: var(--shadow);
}
.section { margin-top: 18px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 2px 8px; }
.section-head h2 { font-size: 14.5px; }
.section-head .sub { font-size: 11.5px; color: var(--ink-3); font-weight: 700; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border-radius: 12px; padding: 11px 14px; font-size: 14px; font-weight: 800;
  background: var(--accent); color: #fff; border: 1px solid transparent;
  transition: transform .06s ease, filter .12s ease;
}
.btn:active { transform: scale(.985); }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.soft { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.btn.danger { background: var(--rose); color: #fff; }
.btn.mini { padding: 7px 10px; font-size: 12px; border-radius: 10px; }
.btn:disabled { opacity: .5; }
.icon-btn {
  width: 34px; height: 34px; flex: none; display: grid; place-items: center;
  border-radius: 10px; color: var(--ink-2); font-size: 15px;
}
.icon-btn:hover { background: var(--line-2); }
.hint { font-size: 12px; color: var(--ink-3); line-height: 1.5; }
.tag-label { font-size: 11px; font-weight: 800; color: var(--ink-3); letter-spacing: .02em; }

/* ---------- 홈 히어로 ---------- */
.hero {
  position: relative; overflow: hidden;
  background: linear-gradient(150deg, #F3F8F4 0%, #FFFDF7 58%, #FBF1E4 100%);
  border: 1px solid var(--line); border-radius: 22px;
  padding: 20px 18px 18px; box-shadow: var(--shadow);
}
.hero::after {
  content: ""; position: absolute; right: -40px; top: -50px; width: 170px; height: 170px;
  background: radial-gradient(closest-side, rgba(47, 107, 95, .13), transparent);
  border-radius: 50%;
}
.hero-greet { font-size: 12.5px; font-weight: 800; color: var(--accent); letter-spacing: .01em; }
.hero h1 { font-size: 21px; line-height: 1.35; margin: 6px 0 14px; font-family: var(--serif); letter-spacing: -.03em; }
.hero.compact { padding: 16px 16px 14px; }
.hero.compact h1 { font-size: 17.5px; margin: 4px 0 10px; }
.hero.compact .cta { padding: 13px 16px; font-size: 15.5px; }
.hero h1 small { display: block; font-family: var(--font); font-size: 12.5px; font-weight: 700; color: var(--ink-2); letter-spacing: 0; margin-top: 7px; }
.cta {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--accent); color: #fff; border-radius: 14px;
  padding: 15px 18px; font-size: 16.5px; font-weight: 900; letter-spacing: -.01em;
  box-shadow: 0 10px 22px -12px rgba(47, 107, 95, .8);
}
.cta:active { filter: brightness(.97); }
.hero-under { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
.hero-under .hint { font-size: 11.5px; }
.linkish { font-size: 12px; font-weight: 800; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

/* ---------- 검색/필터 ---------- */
.tools { display: flex; gap: 8px; margin-top: 16px; align-items: center; }
.search-box {
  flex: 1; display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 13px; padding: 0 12px;
}
.search-box input { flex: 1; border: 0; background: none; outline: none; padding: 12px 0; font-size: 14px; min-width: 0; }
.search-box .ic { font-size: 14px; color: var(--ink-3); }
.filter-btn {
  flex: none; display: inline-flex; align-items: center; gap: 5px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 13px;
  padding: 12px 12px; font-size: 13px; font-weight: 800; color: var(--ink-2);
}
.filter-btn.on { background: var(--accent-soft); color: var(--accent); border-color: #CFE4DD; }
.chip-row { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 2px; margin-top: 10px; scrollbar-width: none; }
.chip-row::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 4px;
  border-radius: 999px; padding: 7px 11px; font-size: 12px; font-weight: 800;
  background: var(--surface); border: 1px solid var(--line); color: var(--ink-2);
  white-space: nowrap;
}
.chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.chip.soft { background: var(--line-2); border-color: transparent; color: var(--ink-2); }
.chip.acc { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.filter-summary { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 9px; font-size: 11.5px; color: var(--ink-3); font-weight: 700; }
.filter-summary .fchip { background: var(--sun-soft); color: #8A601C; border-radius: 8px; padding: 3px 7px; font-weight: 800; }

/* ---------- 기록 카드 ---------- */
.timeline { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.month-head { display: flex; align-items: center; gap: 8px; margin: 12px 2px 2px; }
.month-head b { font-size: 12.5px; letter-spacing: -.01em; }
.month-head span { font-size: 11px; color: var(--ink-3); font-weight: 700; }
.month-head::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.rcard {
  display: flex; gap: 12px; padding: 12px; border-radius: var(--r);
  background: var(--surface); border: 1px solid var(--line);
  box-shadow: 0 1px 2px rgba(43, 42, 38, .03);
  cursor: pointer; position: relative;
}
.rcard:hover { border-color: #DCCFBB; }
.rcard .thumb {
  width: 78px; height: 78px; flex: none; border-radius: 12px; overflow: hidden;
  background: var(--bg-2); display: grid; place-items: center; font-size: 24px; color: var(--ink-3);
}
.rcard .thumb img { width: 100%; height: 100%; object-fit: cover; }
.rbody { flex: 1; min-width: 0; }
.rtop { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.type-chip {
  display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 900;
  border-radius: 7px; padding: 3px 6px; background: var(--line-2); color: var(--ink-2);
}
.type-chip.t0 { background: var(--blue-soft); color: var(--blue); }
.type-chip.t1 { background: var(--sun-soft); color: #8A601C; }
.type-chip.t2 { background: var(--plum-soft); color: var(--plum); }
.type-chip.t3 { background: var(--accent-soft); color: var(--accent); }
.rdate { font-size: 11px; color: var(--ink-3); font-weight: 700; }
.star { margin-left: auto; font-size: 15px; color: #D9CDB8; padding: 0 2px; line-height: 1; }
.star.on { color: #E0A32E; }
.rcard h3 { font-size: 14.5px; margin: 4px 0 2px; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.say {
  font-size: 12.8px; color: var(--ink-2); line-height: 1.5;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.memo { font-size: 11.5px; color: var(--ink-3); margin-top: 4px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
.memo b { font-size: 10px; font-weight: 900; color: var(--ink-3); background: var(--line-2); border-radius: 5px; padding: 1px 4px; margin-right: 3px; }
.rtags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.rtag { font-size: 10.5px; font-weight: 800; color: var(--accent); }
.rfoot { display: flex; align-items: center; gap: 8px; margin-top: 7px; flex-wrap: wrap; }
.meta { font-size: 10.5px; font-weight: 700; color: var(--ink-3); }
.rfoot .mini-act { font-size: 10.5px; font-weight: 900; color: var(--accent); background: var(--accent-soft); border-radius: 7px; padding: 3px 7px; }
.badge-soft { font-size: 10px; font-weight: 900; border-radius: 6px; padding: 2px 5px; background: var(--sun-soft); color: #8A601C; }
.badge-alone { background: var(--accent-soft); color: var(--accent); }

/* ---------- 빈 화면 / 온보딩 ---------- */
.empty {
  text-align: center; color: var(--ink-2); font-size: 13px; line-height: 1.6;
  background: var(--surface); border: 1px dashed #DED2C0; border-radius: var(--r);
  padding: 30px 18px;
}
.empty .e { display: block; font-size: 28px; margin-bottom: 8px; }
.onboard { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.onboard-step {
  display: flex; gap: 10px; align-items: flex-start; text-align: left;
  background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 12px; padding: 11px 12px;
}
.onboard-step .n { width: 22px; height: 22px; flex: none; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 11px; font-weight: 900; }
.onboard-step b { display: block; font-size: 13px; }
.onboard-step span { font-size: 11.5px; color: var(--ink-3); }

/* ---------- 통계 ---------- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 13px; padding: 11px 10px; text-align: center; }
.stat b { display: block; font-size: 17px; letter-spacing: -.02em; }
.stat span { font-size: 10.5px; color: var(--ink-3); font-weight: 700; }

/* ---------- 시트 ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 60; background: rgba(38, 34, 28, .42);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fadein .16s ease;
}
.overlay.center { align-items: center; padding: 16px; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.sheet {
  width: 100%; max-width: 620px; max-height: 92vh; display: flex; flex-direction: column;
  background: var(--surface); border-radius: 22px 22px 0 0; box-shadow: var(--shadow-lg);
  animation: slideup .22s cubic-bezier(.22, .68, .36, 1);
}
.overlay.center .sheet { border-radius: 20px; max-height: 88vh; }
@keyframes slideup { from { transform: translateY(22px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet-grab { width: 40px; height: 4px; border-radius: 99px; background: #E2D8C7; margin: 9px auto 0; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; border-bottom: 1px solid var(--line-2); }
.sheet-head h2 { font-size: 15.5px; flex: 1; min-width: 0; }
.sheet-body { padding: 14px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sheet-foot { display: flex; gap: 8px; margin-top: 14px; }
.sheet-foot .btn { flex: 1; }
.field { margin-bottom: 13px; }
.field > label, .field > .lab { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 900; color: var(--ink-2); margin-bottom: 6px; }
.field > label .opt { font-size: 10px; font-weight: 700; color: var(--ink-3); background: var(--line-2); border-radius: 5px; padding: 1px 5px; }
.input, .textarea, .select {
  width: 100%; border: 1px solid var(--line); background: var(--surface-2);
  border-radius: 11px; padding: 10px 12px; font-size: 14px; outline: none;
}
.input:focus, .textarea:focus, .select:focus { border-color: var(--accent-2); background: #fff; box-shadow: 0 0 0 3px rgba(62, 140, 123, .12); }
.textarea { min-height: 74px; resize: vertical; line-height: 1.55; }
.textarea.tall { min-height: 96px; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; min-width: 0; }
.toggle-row { display: flex; gap: 6px; flex-wrap: wrap; }
.seg { display: flex; background: var(--line-2); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border-radius: 9px; padding: 8px 6px; font-size: 12.5px; font-weight: 800; color: var(--ink-2); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(43, 42, 38, .12); }
.toglio { }

/* 미디어 버튼 */
.media-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.media-btn {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 13px;
  padding: 12px 6px; font-size: 11.5px; font-weight: 800; color: var(--ink-2);
}
.media-btn span.i { font-size: 20px; }
.media-btn:active { background: var(--bg-2); }
.media-btn.rec { border-color: #E9C9C2; background: var(--rose-soft); color: var(--rose); }
.media-list { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
.media-item {
  position: relative; width: 76px; height: 76px; border-radius: 11px; overflow: hidden;
  border: 1px solid var(--line); background: var(--bg-2); display: grid; place-items: center;
}
.media-item img { width: 100%; height: 100%; object-fit: cover; }
.media-item .fi { font-size: 11px; text-align: center; padding: 6px; line-height: 1.3; color: var(--ink-2); word-break: break-all; }
.media-item.audio { width: 168px; height: auto; padding: 6px 6px 4px; place-items: stretch; }
.media-item.audio audio { width: 100%; height: 30px; }
.media-item audio { width: 76px; height: 26px; }
.media-item .x {
  position: absolute; top: 2px; right: 2px; width: 19px; height: 19px; border-radius: 50%;
  background: rgba(30, 28, 24, .72); color: #fff; font-size: 10px; display: grid; place-items: center;
}
.rec-bar {
  display: flex; align-items: center; gap: 10px; margin-top: 9px;
  background: var(--rose-soft); border: 1px solid #EFD3CD; border-radius: 12px; padding: 10px 12px;
}
.rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--rose); animation: pulse 1s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
.rec-time { font-variant-numeric: tabular-nums; font-weight: 900; color: var(--rose); font-size: 13px; }

/* 태그 입력 */
.tag-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-add { display: flex; gap: 6px; margin-top: 7px; }
.tag-add .input { flex: 1; padding: 8px 11px; font-size: 13px; }
.tag-add .btn { flex: none; }
.topic-chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- 모아보기 ---------- */
.mv-tabs { display: flex; gap: 6px; margin: 12px 0 4px; }
.mv-tabs button { flex: 1; border-radius: 12px; padding: 10px; font-size: 13px; font-weight: 900; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); }
.mv-tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.topic-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; margin-top: 12px; }
.topic-card {
  text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 13px 12px; box-shadow: var(--shadow);
}
.topic-card .tname { font-size: 14px; font-weight: 900; letter-spacing: -.01em; }
.topic-card .tcount { font-size: 11px; color: var(--ink-3); font-weight: 700; margin-top: 3px; }
.topic-card .tlast { font-size: 10.5px; color: var(--ink-3); margin-top: 6px; }
.topic-card .temojis { font-size: 12px; letter-spacing: 1px; margin-top: 4px; }
.period-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.period-block {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px;
}
.period-block .pl { font-size: 14px; font-weight: 900; }
.period-block .pc { font-size: 11px; color: var(--ink-3); font-weight: 700; margin-top: 2px; }
.period-thumbs { display: flex; gap: 4px; margin-left: auto; }
.period-thumbs img, .period-thumbs .ph { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; background: var(--bg-2); display: grid; place-items: center; font-size: 12px; }

/* ---------- 서류함 ---------- */
.lock-wrap { text-align: center; padding: 34px 18px; }
.lock-wrap .lock-ic { font-size: 34px; }
.lock-wrap h2 { font-size: 16px; margin: 10px 0 4px; }
.pin-input {
  width: 150px; text-align: center; letter-spacing: 12px; font-size: 20px; font-weight: 900;
  padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2);
}
.doc-card {
  display: flex; gap: 11px; align-items: flex-start; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px;
  box-shadow: 0 1px 2px rgba(43, 42, 38, .03);
}
.doc-ic { width: 40px; height: 40px; flex: none; border-radius: 10px; background: var(--blue-soft); display: grid; place-items: center; font-size: 18px; }
.doc-card h3 { font-size: 13.8px; line-height: 1.35; }
.doc-card .dmeta { font-size: 11px; color: var(--ink-3); font-weight: 700; margin-top: 3px; }
.doc-card .dnote { font-size: 11.5px; color: var(--ink-2); margin-top: 4px; }
.doc-card .dright { margin-left: auto; flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.status { font-size: 10px; font-weight: 900; border-radius: 6px; padding: 2px 6px; white-space: nowrap; }
.status.s0 { background: var(--accent-soft); color: var(--accent); }
.status.s1 { background: var(--rose-soft); color: var(--rose); }
.status.s2 { background: var(--blue-soft); color: var(--blue); }
.doc-file { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; color: var(--blue); margin-top: 5px; margin-right: 8px; }

/* ---------- 설정 ---------- */
.set-group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-top: 12px; }
.set-group > h2 { font-size: 13.5px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.set-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line-2); }
.set-row:last-child { border-bottom: 0; }
.set-row .sl { flex: 1; min-width: 0; }
.set-row .sl b { display: block; font-size: 13px; }
.set-row .sl span { font-size: 11px; color: var(--ink-3); }
.set-row .btn { flex: none; }
.sync-line { display: flex; align-items: flex-start; gap: 7px; font-size: 12px; font-weight: 800; margin-top: 6px; line-height: 1.55; }
.sync-line > span:first-child { flex: none; font-size: 12px; line-height: 1.5; }
.meter { height: 6px; border-radius: 99px; background: var(--line-2); overflow: hidden; margin-top: 8px; }
.meter > i { display: block; height: 100%; background: var(--accent-2); border-radius: 99px; }
.meter.warn > i { background: var(--sun); }
.meter.over > i { background: var(--rose); }
.code-box {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
  background: var(--bg-2); border: 1px dashed #D8CBB6; border-radius: 10px; padding: 9px 10px;
  word-break: break-all; color: var(--ink-2);
}
.restore-item { display: flex; gap: 8px; align-items: center; font-size: 12px; padding: 5px 0; }
.restore-item .cnt { margin-left: auto; font-weight: 900; }

/* ---------- 하단 탭 ---------- */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  display: flex; justify-content: center; gap: 2px;
  background: rgba(255, 253, 249, .94); backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: 6px 6px calc(6px + var(--safe-b));
}
.tabbar .tab {
  flex: 1; max-width: 150px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 5px 2px; border-radius: 12px; font-size: 10.5px; font-weight: 800; color: var(--ink-3);
}
.tabbar .tab .ti { font-size: 18px; line-height: 1.15; filter: grayscale(.55); }
.tabbar .tab.on { color: var(--accent); background: var(--accent-soft); }
.tabbar .tab.on .ti { filter: none; }

/* ---------- 토스트 ---------- */
.toast-root { position: fixed; left: 0; right: 0; bottom: calc(76px + var(--safe-b)); z-index: 90; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.toast {
  background: rgba(36, 33, 28, .94); color: #fff; font-size: 12.5px; font-weight: 700;
  border-radius: 11px; padding: 9px 14px; max-width: 88vw; text-align: center;
  box-shadow: var(--shadow-lg);
}

/* ---------- 인쇄/PDF ---------- */
.print-root { display: none; }
.print-root.show {
  display: block; position: fixed; inset: 0; z-index: 200; background: #fff; overflow: auto;
  padding: 0 0 70px;
}
.print-bar {
  position: sticky; top: 0; display: flex; gap: 8px; align-items: center;
  background: #F7F4EE; border-bottom: 1px solid var(--line); padding: 10px 14px;
}
.print-bar b { font-size: 13px; flex: 1; }
.print-doc { max-width: 780px; margin: 0 auto; padding: 22px 18px 40px; color: #222; font-size: 13px; }
.print-doc h1 { font-size: 22px; margin-bottom: 4px; }
.print-doc .pd-sub { font-size: 11.5px; color: #777; margin-bottom: 4px; }
.print-doc .pd-note { font-size: 10.5px; color: #8A601C; background: #FBF3E4; border-radius: 7px; padding: 6px 9px; margin: 10px 0 18px; display: inline-block; }
.print-doc .pd-sec { border-top: 1px solid #E4DED4; padding: 14px 0; page-break-inside: avoid; }
.print-doc .pd-sec h3 { font-size: 15px; margin-bottom: 3px; }
.print-doc .pd-meta { font-size: 11px; color: #777; margin-bottom: 6px; }
.print-doc .pd-say { font-size: 13px; background: #F5F8F6; border-left: 3px solid #7FA99E; padding: 8px 10px; margin: 6px 0; white-space: pre-wrap; }
.print-doc .pd-memo { font-size: 12px; color: #555; border-left: 3px solid #D9C9A8; padding: 4px 10px; margin: 6px 0; white-space: pre-wrap; }
.print-doc .pd-imgs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.print-doc .pd-imgs img { width: 148px; height: 148px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }
.print-doc .pd-file { font-size: 11px; color: #555; }
.print-doc .pd-toc { font-size: 12px; color: #444; margin-top: 8px; }
.print-doc .pd-toc td { padding: 3px 8px 3px 0; }
.print-empty { color: #888; font-size: 12px; }

/* ---------- PC ---------- */
@media (min-width: 900px) {
  body { font-size: 15.5px; }
  #app { max-width: 1080px; padding: 0 26px 120px; }
  .topbar { padding: 16px 2px 12px; }
  .brand-text strong { font-size: 16.5px; }
  .main { display: block; }
  [data-page="home"] .timeline { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  [data-page="home"] .month-head { grid-column: 1 / -1; }
  .hero { padding: 26px 26px 22px; }
  .hero h1 { font-size: 25px; }
  .cta { max-width: 380px; }
  .hero-under { max-width: 520px; }
  .topic-grid { grid-template-columns: repeat(4, 1fr); }
  .tabbar { position: sticky; bottom: 18px; margin: 26px auto 0; max-width: 520px; border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 6px; background: rgba(255, 253, 249, .96); }
  .toast-root { bottom: 110px; }
  .sheet-body { padding: 16px 18px; }
  .stats { grid-template-columns: repeat(3, 1fr); max-width: 520px; }
}
@media (max-width: 380px) {
  .media-btns { grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .media-btn { font-size: 10.5px; }
}

/* ---------- 인쇄 ---------- */
@media print {
  html, body { background: #fff !important; }
  body > #app, body > #modalRoot, body > #toastRoot, .print-bar { display: none !important; }
  .print-root, .print-root.show { display: block !important; position: static !important; inset: auto !important; overflow: visible !important; padding: 0 !important; }
  .print-doc { max-width: none; padding: 0; font-size: 11pt; }
  .print-doc .pd-sec { page-break-inside: avoid; }
  .print-doc .pd-imgs img { width: 118px; height: 118px; }
}

<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true">🌱</span>
      <div class="brand-text">
        <strong id="brandTitle">우리집 성장 기록</strong>

<div id="modalRoot"></div>

<div id="printRoot" class="print-root" aria-hidden="true"></div>
<input type="file" id="hiddenFile" hidden>
<script>/* ===== app1_core.js ===== */
/* =====================================================================
   1. 코어 — 상태·저장·화면 전환·공통 UI
   · 한 아이의 성장 기록을 사진 한 장, 말 한 줄로 남기는 가족용 앱
   · 실제 가족 정보는 코드에 넣지 않는다(기기/가족 방 안에서만)
   ===================================================================== */
const KEY = 'growth-archive-v1';
const APP_VERSION = '1.0.0';
const TYPES = [
  {id: '생각', emoji: '💬'},
  {id: '질문·탐구', emoji: '🔍'},
  {id: '작품', emoji: '🎨'},
  {id: '협업', emoji: '🤝'},
];
const PRESET_TOPICS = ['로봇', '수학', '자연', '만들기', '그림', '음악', '몸놀이', '이야기'];
const DOC_STATUS = ['보유중', '재발급필요', '완료'];
const HELPED = [
  {id: 'alone', label: '혼자 함', emoji: '🙌'},
  {id: 'helped', label: '도움받음', emoji: '🤲'},
  {id: 'unknown', label: '모름·미기록', emoji: '·'},
];
const MEDIA_LIMIT = {image: 900 * 1024, file: 2.5 * 1024 * 1024, audio: 2.2 * 1024 * 1024, count: 8};

/* ---------- 작은 도구 ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const arr = v => (Array.isArray(v) ? v : []);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const uid = p => (p || 'x') + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = (v, d = 0) => { const n = Number(v); return Number.isFinite(n) ? n : d; };
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const pad2 = n => String(n).padStart(2, '0');
function dayKey(d) {
  const x = d ? new Date(d) : new Date();
  if (isNaN(x)) return '';
  return x.getFullYear() + '-' + pad2(x.getMonth() + 1) + '-' + pad2(x.getDate());
}
function parseDay(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
  if (!m) return null;
  const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return isNaN(d) ? null : d;
}
function fmtDate(s) {
  const d = parseDay(s);
  return d ? d.getFullYear() + '.' + pad2(d.getMonth() + 1) + '.' + pad2(d.getDate()) : '';
}
function fmtDateKo(s) {
  const d = parseDay(s);
  return d ? (d.getMonth() + 1) + '월 ' + d.getDate() + '일' : '';
}
function fmtStamp(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return isNaN(d) ? '' : d.getFullYear() + '.' + pad2(d.getMonth() + 1) + '.' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function mmss(sec) { sec = Math.max(0, Math.round(sec)); return pad2(Math.floor(sec / 60)) + ':' + pad2(sec % 60); }
function typeMeta(id) { return TYPES.find(t => t.id === id) || TYPES[0]; }
function typeIndex(id) { const i = TYPES.findIndex(t => t.id === id); return i < 0 ? 0 : i; }
function helpedMeta(id) { return HELPED.find(h => h.id === id) || HELPED[2]; }
function statusIndex(s) { const i = DOC_STATUS.indexOf(s); return i < 0 ? 0 : i; }
function cleanTopic(s) { return String(s == null ? '' : s).replace(/^#+/, '').replace(/[,\n\r\t]/g, ' ').trim().slice(0, 24); }
function topicsOf(r) { return arr(r && r.topics).map(cleanTopic).filter(Boolean); }
function bytesText(n) {
  n = num(n, 0);
  return n >= 1024 * 1024 ? (n / 1024 / 1024).toFixed(1) + 'MB' : n >= 1024 ? Math.round(n / 1024) + 'KB' : n + 'B';
}
function mediaImages(r) {
  const out = [];
  arr(r && r.media).forEach(m => { if (m && m.kind === 'image' && m.data) out.push(m); });
  arr(r && r.versions).forEach(v => arr(v && v.media).forEach(m => { if (m && m.kind === 'image' && m.data) out.push(m); }));
  return out;
}
function thumbOf(r) {
  const im = mediaImages(r)[0];
  if (im) return '<img src="' + im.data + '" alt="">';
  const t = typeMeta(r && r.type);
  return '<span>' + t.emoji + '</span>';
}
function mediaCount(r) {
  let n = arr(r && r.media).length;
  arr(r && r.versions).forEach(v => { n += arr(v && v.media).length; });
  return n;
}
function sortRecords(list) {
  return arr(list).slice().sort((a, b) => {
    const da = a.date || '', db = b.date || '';
    if (da !== db) return da < db ? 1 : -1;
    return num(b.createdAt) - num(a.createdAt);
  });
}
function recTitle(r) {
  const t = String((r && r.title) || '').trim();
  return t || autoTitle(r);
}
function autoTitle(r) {
  const day = fmtDateKo(r && r.date) || fmtDateKo(dayKey());
  const t = typeMeta(r && r.type);
  return day + ' · ' + t.id;
}
function ageText(dateStr) {
  const b = parseDay(state.profile.birthDate);
  const d = parseDay(dateStr) || new Date();
  if (!b || isNaN(d)) return '';
  let months = (d.getFullYear() - b.getFullYear()) * 12 + (d.getMonth() - b.getMonth());
  if (d.getDate() < b.getDate()) months -= 1;
  if (months < 0) return '';
  const y = Math.floor(months / 12), m = months % 12;
  return '만 ' + y + '세' + (m ? ' ' + m + '개월' : '');
}
function ageMonths(dateStr) {
  const b = parseDay(state.profile.birthDate);
  const d = parseDay(dateStr);
  if (!b || !d) return null;
  let months = (d.getFullYear() - b.getFullYear()) * 12 + (d.getMonth() - b.getMonth());
  if (d.getDate() < b.getDate()) months -= 1;
  return months;
}

/* ---------- 기본 상태 ---------- */
function defaults() {
  return {
    v: 1,
    profile: {childName: '', birthDate: ''},
    settings: {docPin: '', docsLocked: false, collectionNote: ''},
    records: [],
    docs: [],
    deleted: {records: {}, docs: {}},     /* 지운 항목 표식(다른 기기에서 되살아나지 않게) */
    updatedAt: 0,
  };
}

function sanitizeMedia(m) {
  if (!m || typeof m !== 'object') return null;
  const kind = ['image', 'file', 'audio'].includes(m.kind) ? m.kind : 'file';
  const data = typeof m.data === 'string' ? m.data.slice(0, 3200000) : '';
  const path = typeof m.path === 'string' ? m.path.slice(0, 300) : '';
  if (!data && !path) return null;
  return {
    id: m.id ? String(m.id).slice(0, 40) : uid('m'),
    kind, data, path,
    name: String(m.name || (kind === 'image' ? '사진' : kind === 'audio' ? '녹음' : '파일')).slice(0, 120),
    mime: String(m.mime || '').slice(0, 80),
    size: clamp(num(m.size, 0), 0, 20000000),
    w: clamp(num(m.w, 0), 0, 20000), h: clamp(num(m.h, 0), 0, 20000),
    dur: clamp(num(m.dur, 0), 0, 600),
  };
}
function sanitizeTopicList(list) {
  const seen = {};
  const out = [];
  arr(list).forEach(x => {
    const t = cleanTopic(x);
    if (t && !seen[t.toLowerCase()]) { seen[t.toLowerCase()] = 1; out.push(t); }
  });
  return out.slice(0, 10);
}
function sanitizeVersion(v) {
  if (!v || typeof v !== 'object') return null;
  const media = arr(v.media).map(sanitizeMedia).filter(Boolean).slice(0, MEDIA_LIMIT.count);
  const entry = {
    id: v.id ? String(v.id).slice(0, 40) : uid('ver'),
    date: parseDay(v.date) ? String(v.date) : dayKey(),
    childSay: String(v.childSay || '').slice(0, 4000),
    note: String(v.note || '').slice(0, 4000),
    media,
    at: num(v.at, Date.now()),
  };
  if (!entry.childSay && !entry.note && !media.length) return null;
  return entry;
}
function sanitizeRecord(r) {
  if (!r || typeof r !== 'object') return null;
  const media = arr(r.media).map(sanitizeMedia).filter(Boolean).slice(0, MEDIA_LIMIT.count);
  const versions = arr(r.versions).map(sanitizeVersion).filter(Boolean).slice(0, 60);
  const rec = {
    id: r.id ? String(r.id).slice(0, 40) : uid('rec'),
    title: String(r.title || '').slice(0, 160),
    date: parseDay(r.date) ? String(r.date) : dayKey(),
    type: TYPES.some(t => t.id === r.type) ? r.type : TYPES[0].id,
    topics: sanitizeTopicList(r.topics),
    childSay: String(r.childSay || '').slice(0, 8000),
    parentNote: String(r.parentNote || '').slice(0, 8000),
    helped: ['alone', 'helped', 'unknown'].includes(r.helped) ? r.helped : 'unknown',
    media, versions,
    fav: !!r.fav,
    later: !!r.later,
    createdAt: num(r.createdAt, Date.now()),
    updatedAt: num(r.updatedAt, Date.now()),
  };
  if (!rec.title && !rec.childSay && !rec.parentNote && !media.length && !versions.length) return null;
  return rec;
}
function sanitizeDoc(d) {
  if (!d || typeof d !== 'object') return null;
  const name = String(d.name || '').slice(0, 160).trim();
  if (!name && !arr(d.media).length) return null;
  return {
    id: d.id ? String(d.id).slice(0, 40) : uid('doc'),
    name: name || '이름 없는 서류',
    issuer: String(d.issuer || '').slice(0, 120),
    period: String(d.period || '').slice(0, 80),
    issuedAt: parseDay(d.issuedAt) ? String(d.issuedAt) : '',
    location: String(d.location || '').slice(0, 160),
    status: DOC_STATUS.includes(d.status) ? d.status : DOC_STATUS[0],
    note: String(d.note || '').slice(0, 4000),
    media: arr(d.media).map(sanitizeMedia).filter(Boolean).slice(0, 8),
    createdAt: num(d.createdAt, Date.now()),
    updatedAt: num(d.updatedAt, Date.now()),
  };
}
function sanitize(raw) {
  const d = defaults();
  if (!raw || typeof raw !== 'object') return d;
  const s = d;
  s.v = 1;
  s.profile = {
    childName: String((raw.profile && raw.profile.childName) || '').slice(0, 40).trim(),
    birthDate: parseDay(raw.profile && raw.profile.birthDate) ? raw.profile.birthDate : '',
  };
  const set = (raw.settings && typeof raw.settings === 'object') ? raw.settings : {};
  s.settings = {
    docPin: /^\d{4}$/.test(String(set.docPin || '')) ? String(set.docPin) : '',
    docsLocked: !!set.docsLocked,
    collectionNote: String(set.collectionNote || '').slice(0, 200),
  };
  s.records = arr(raw.records).map(sanitizeRecord).filter(Boolean).slice(0, 4000);
  s.docs = arr(raw.docs).map(sanitizeDoc).filter(Boolean).slice(0, 800);
  s.deleted = sanitizeTombstones(raw.deleted);
  s.updatedAt = num(raw.updatedAt, 0);
  return s;
}

function sanitizeTombstones(raw) {
  const out = {records: {}, docs: {}};
  const cut = Date.now() - 365 * 86400000;
  const take = (src, dst) => {
    if (!src || typeof src !== 'object') return;
    Object.keys(src).slice(0, 600).forEach(k => {
      const t = num(src[k], 0);
      if (t > cut) dst[String(k).slice(0, 40)] = t;
    });
  };
  take(raw && raw.records, out.records);
  take(raw && raw.docs, out.docs);
  return out;
}

let state = defaults();
const UI = {
  view: 'home',
  q: '', types: [], topics: [], period: 'all', ageRange: 'all', attach: 'all', fav: false, later: false,
  mv: 'topics', periodMode: 'month',
  docQ: '', docStatus: 'all',
  locked: true,
  booted: false,
};
const FORM = {media: [], versionOf: '', editId: ''};

function loadLocal() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return false;
    state = sanitize(JSON.parse(raw));
    return true;
  } catch (e) { state = defaults(); return false; }
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); return true; }
  catch (e) {
    toast('이 기기 저장 공간이 부족해요. 사진·음성 기록을 줄이거나 ZIP으로 백업해 주세요.', 4200);
    return false;
  }
}
function save(opts) {
  opts = opts || {};
  state.updatedAt = Date.now();
  const ok = persist();
  if (!opts.silent && window.GASync) window.GASync.schedulePush();
  return ok;
}

/* ---------- 토스트 ---------- */
function toast(msg, ms) {
  const root = $('#toastRoot');
  if (!root) return;
  while (root.children.length >= 2) root.firstElementChild.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, ms || 2400);
}

/* ---------- 시트 ---------- */
let sheetStack = [];
function openSheet(html, opts) {
  opts = opts || {};
  closeAllSheets();
  if (typeof cancelRecording === 'function') cancelRecording();
  const wrap = document.createElement('div');
  wrap.className = 'overlay' + (opts.center ? ' center' : '');
  wrap.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(opts.title || '') + '">' +
    (opts.center ? '' : '<div class="sheet-grab"></div>') +
    '<div class="sheet-head"><h2>' + (opts.title || '') + '</h2>' +
    '<button class="icon-btn" data-act="closeSheet" aria-label="닫기">✕</button></div>' +
    '<div class="sheet-body">' + html + '</div></div>';
  wrap.addEventListener('click', e => { if (e.target === wrap) closeSheet(); });
  $('#modalRoot').appendChild(wrap);
  sheetStack.push(wrap);
  if (opts.onMount) setTimeout(() => { try { opts.onMount(wrap); } catch (e) {} }, 0);
  return wrap;
}
function closeSheet() {
  if (typeof cancelRecording === 'function') cancelRecording();
  const w = sheetStack.pop();
  if (w) w.remove();
}
function closeAllSheets() {
  if (typeof cancelRecording === 'function') cancelRecording();
  sheetStack.forEach(w => w.remove());
  sheetStack = [];
}
function sheetShell(title, bodyHtml, footHtml, opts) {
  return openSheet(bodyHtml + (footHtml ? '<div class="sheet-foot">' + footHtml + '</div>' : ''), Object.assign({title}, opts || {}));
}
function askConfirm(title, text, okLabel, danger) {
  return new Promise(resolve => {
    const w = openSheet(
      '<p style="font-size:13.5px;line-height:1.62;color:var(--ink-2)">' + text + '</p>' +
      '<div class="sheet-foot"><button class="btn ghost" data-x="0" style="flex:1">취소</button>' +
      '<button class="btn ' + (danger ? 'danger' : '') + '" data-x="1" style="flex:1.35">' + esc(okLabel || '확인') + '</button></div>',
      {title: title, center: true}
    );
    const finish = v => { const i = sheetStack.indexOf(w); if (i >= 0) sheetStack.splice(i, 1); w.remove(); resolve(v); };
    w.addEventListener('click', e => {
      const b = e.target.closest('[data-x]');
      if (b) finish(b.dataset.x === '1');
      else if (e.target === w) finish(false);
    });
  });
}
function askText(title, label, value, placeholder) {
  return new Promise(resolve => {

    );
    const finish = v => { const i = sheetStack.indexOf(w); if (i >= 0) sheetStack.splice(i, 1); w.remove(); resolve(v); };
    w.addEventListener('click', e => {
      const b = e.target.closest('[data-x]');
      if (b) finish(b.dataset.x === '1' ? String(($('#askTextInput', w) || {}).value || '').trim() : null);
      else if (e.target === w) finish(null);

/* ---------- 필터 ---------- */
function activeFilterCount() {
  let n = 0;
  if (UI.types.length) n += UI.types.length;
  if (UI.topics.length) n += UI.topics.length;
  if (UI.period !== 'all') n++;
  if (UI.ageRange !== 'all') n++;
  if (UI.attach !== 'all') n++;
  if (UI.fav) n++;
  if (UI.later) n++;
  return n;
}
function periodStart() {
  const now = new Date();
  if (UI.period === '3m') return dayKey(new Date(now.getFullYear(), now.getMonth() - 3, now.getDate()));
  if (UI.period === '1y') return dayKey(new Date(now.getFullYear() - 1, now.getMonth(), now.getDate()));
  if (UI.period === 'thisYear') return now.getFullYear() + '-01-01';
  if (UI.period === 'lastYear') return (now.getFullYear() - 1) + '-01-01';
  return '';
}
function periodEnd() {
  const now = new Date();
  if (UI.period === 'lastYear') return (now.getFullYear() - 1) + '-12-31';
  return '9999-12-31';
}
function matchRecord(r) {
  const q = UI.q.trim().toLowerCase();
  if (q) {
    const hay = [r.title, r.childSay, r.parentNote, topicsOf(r).join(' '), arr(r.versions).map(v => v.childSay + ' ' + v.note).join(' ')].join(' ').toLowerCase();
    if (hay.indexOf(q) < 0) return false;
  }
  if (UI.types.length && UI.types.indexOf(r.type) < 0) return false;
  if (UI.topics.length) {
    const t = topicsOf(r).map(x => x.toLowerCase());
    if (!UI.topics.every(x => t.indexOf(x.toLowerCase()) >= 0)) return false;
  }
  if (UI.period !== 'all') {
    const from = periodStart(), to = periodEnd();
    if (!(r.date >= from && r.date <= to)) return false;
  }
  if (UI.ageRange !== 'all') {
    const m = ageMonths(r.date);
    if (m == null) return false;
    const parts = UI.ageRange.split('-').map(Number);
    if (!(m >= parts[0] * 12 && m < (parts[1] + 1) * 12)) return false;
  }
  if (UI.attach === 'yes' && mediaCount(r) === 0) return false;
  if (UI.attach === 'no' && mediaCount(r) > 0) return false;
  if (UI.fav && !r.fav) return false;
  if (UI.later && !r.later) return false;
  return true;
}
function filteredRecords() { return sortRecords(state.records).filter(matchRecord); }
function resetFilters() {
  UI.q = ''; UI.types = []; UI.topics = []; UI.period = 'all'; UI.ageRange = 'all'; UI.attach = 'all'; UI.fav = false; UI.later = false;
}
function allTopics() {
  const map = {};
  state.records.forEach(r => topicsOf(r).forEach(t => {
    const k = t.toLowerCase();
    if (!map[k]) map[k] = {name: t, count: 0, last: '', kinds: {}};
    map[k].count++;
    if ((r.date || '') > map[k].last) map[k].last = r.date || '';
    map[k].kinds[r.type] = (map[k].kinds[r.type] || 0) + 1;
    if (map[k].name !== t && t.length < map[k].name.length) map[k].name = t;
  }));
  return Object.keys(map).map(k => map[k]).sort((a, b) => b.count - a.count || (a.name < b.name ? -1 : 1));
}
function typeCounts(list) {
  const c = {};
  TYPES.forEach(t => { c[t.id] = 0; });
  arr(list).forEach(r => { if (c[r.type] != null) c[r.type]++; });
  return c;
}

function roomSafe(v) {
  const s = String(v == null ? '' : v).trim().replace(/[^A-Za-z0-9_-]/g, '-').slice(0, 48);

    const safe = roomSafe(u);

  } catch (e) {}
  if (!r) {
    try {
      const stored = roomSafe(localStorage.getItem(SYNC_ROOM_KEY));
      if (stored && !roomBlocked(stored)) r = stored;
      else if (stored) localStorage.removeItem(SYNC_ROOM_KEY);

  try { localStorage.setItem(SYNC_ROOM_KEY, s); } catch (e) {}

function syncPayload() {
  const data = {};
  SYNC_KEYS.forEach(k => { if (state[k] !== undefined) data[k] = state[k]; });

}
/* 실제 기록이 있는지 — 빈 초기 상태를 올려 다른 기기 기록을 지우지 않기 위한 판별 */
function hasMeaningfulData(o) {
  const s = (o && typeof o === 'object') ? o : state;
  if (arr(s.records).length || arr(s.docs).length) return true;
  const del = (s.deleted && typeof s.deleted === 'object') ? s.deleted : {};
  if (Object.keys(del.records || {}).length || Object.keys(del.docs || {}).length) return true;
  if (s.profile && String(s.profile.childName || '').trim()) return true;
  if (s.profile && s.profile.birthDate) return true;

}
function payloadBytes(p) {

  catch (e) { try { return JSON.stringify(p || syncPayload()).length; } catch (e2) { return 0; } }
}
function syncLabel(s) {

    : s === 'offline' ? '🟠 오프라인 — 이 기기 기록은 그대로 남아 있고, 인터넷이 되면 자동으로 다시 맞춰요.'

}
/* 두 기기가 동시에 남긴 기록을 잃지 않도록 ID 기준 합집합으로 합친다.
   · 같은 ID는 더 새로 고친(updatedAt) 쪽을 쓴다
   · 지운 항목(deleted)은 그 뒤로 고쳐지지 않은 한 되살리지 않는다 */
function mergeById(localList, remoteList, tomb) {
  const map = {};
  arr(localList).forEach(x => { if (x && x.id) map[x.id] = x; });
  arr(remoteList).forEach(x => {
    if (!x || !x.id) return;
    const cur = map[x.id];
    if (!cur || num(x.updatedAt) > num(cur.updatedAt)) map[x.id] = x;

  return Object.keys(map).map(k => map[k]).filter(x => !(tomb[x.id] && tomb[x.id] >= num(x.updatedAt, 0)));

function mergeTomb(a, b) {
  const out = {};
  [a, b].forEach(src => {
    Object.keys(src || {}).forEach(k => { out[k] = Math.max(num(out[k], 0), num(src[k], 0)); });
  });
  return out;
}
function applyRemote(remote, force) {
  if (!remote || typeof remote !== 'object') return false;
  const at = num(remote.updatedAt, 0);
  if (!force && !(at > num(state.updatedAt, 0))) return false;
  const data = (remote.data && typeof remote.data === 'object') ? remote.data : null;
  if (!data) return false;
  Sync.applying = true;
  let ok = false;
  let grew = false;
  try {
    const remoteClean = sanitize({profile: data.profile, settings: data.settings, records: data.records, docs: data.docs, deleted: data.deleted, updatedAt: at});
    if (force) {
      const keepName = state.profile.childName || remoteClean.profile.childName;
      const keepBirth = state.profile.birthDate || remoteClean.profile.birthDate;
      state = sanitize({
        v: 1,
        profile: {childName: keepName, birthDate: keepBirth},
        settings: Object.assign({}, remoteClean.settings, state.settings.docPin ? {docPin: state.settings.docPin} : {}),
        records: remoteClean.records, docs: remoteClean.docs, deleted: remoteClean.deleted,
        updatedAt: Math.max(num(state.updatedAt, 0), at),
      });
      persist();
      if (typeof render === 'function') render();
      Sync.applying = false;
      Sync.lastAt = at;
      return true;
    }
    const tombR = mergeTomb(state.deleted.records, remoteClean.deleted.records);
    const tombD = mergeTomb(state.deleted.docs, remoteClean.deleted.docs);
    const localIds = state.records.map(r => r.id).sort().join(',') + '|' + state.docs.map(d => d.id).sort().join(',');
    const records = mergeById(state.records, remoteClean.records, tombR);
    const docs = mergeById(state.docs, remoteClean.docs, tombD);
    const mergedIds = records.map(r => r.id).sort().join(',') + '|' + docs.map(d => d.id).sort().join(',');
    grew = mergedIds !== localIds;
    const profile = Object.assign({}, remoteClean.profile);
    if (state.profile.childName) profile.childName = state.profile.childName;
    if (state.profile.birthDate) profile.birthDate = state.profile.birthDate;
    const settings = Object.assign({}, remoteClean.settings);
    if (state.settings.docPin) settings.docPin = state.settings.docPin;
    const merged = sanitize({
      v: 1, profile, settings, records, docs,
      deleted: {records: tombR, docs: tombD},
      updatedAt: Math.max(num(state.updatedAt, 0), at),
    });
    state = merged;
    persist();
    if (typeof render === 'function') render();
    ok = true;
    Sync.lastAt = at;
  } catch (e) { ok = false; }
  Sync.applying = false;
  if (ok && grew) {
    /* 이 기기에만 있던 기록을 합쳐 넣었으면, 그 합친 상태를 가족 방에도 알린다 */
    state.updatedAt = Date.now();
    persist();
    pushNow();
  }
  return ok;
}
function onRemote(val) {
  const remote = (val && typeof val === 'object') ? val : null;
  if (Sync.status !== 'online' && Sync.status !== 'offline') setSyncStatus('online');
  const rat = remote ? num(remote.updatedAt, 0) : 0;
  const rdata = (remote && remote.data && typeof remote.data === 'object') ? remote.data : null;
  const remoteHas = !!(rdata && hasMeaningfulData(rdata));
  const localHas = hasMeaningfulData(state);

  if (!Sync.primed) {
    Sync.primed = true;
    if (remoteHas) {
      if (!localHas) { applyRemote(remote, true); return; }              /* 기록 없는 새 기기 → 클라우드 기록을 먼저 받는다 */
      if (!rat) { uploadNow(); return; }                                  /* 시각 없는 옛 업로드 → 이 기기 기록에 새 시각 */
      if (rat > num(state.updatedAt, 0)) { applyRemote(remote); return; }
      pushNow();                                                          /* 이 기기가 더 새로움 → 올린다 */
      return;
    }
    /* 클라우드가 비었거나 초기값뿐 → 이 기기 기록이 있을 때만 올린다(빈 상태 보호) */
    if (localHas) uploadNow();
    return;
  }
  if (!rdata) return;                     /* 방이 비었다 — 이 기기 기록은 그대로 둔다 */
  if (!remoteHas) { if (localHas) uploadNow(); return; }

function schedulePush() {

}
function uploadNow() {
  if (!Sync.room) return false;
  Sync.primed = true;

  pushNow();
  return true;
}
function pushNow() {
  if (!Sync.room || roomBlocked(Sync.room)) return;
  if (!hasMeaningfulData(state)) return;   /* 안전장치 ①: 빈 상태는 올리지 않는다 */
  const payload = syncPayload();
  const done = ok => {
    if (ok) { setSyncStatus('online'); Sync.lastError = ''; }
    else { Sync.lastError = 'push'; setSyncStatus('offline'); if (Sync.mode === 'sdk') startREST(); }
    const st = $('#syncSize'); if (st) st.textContent = bytesText(payloadBytes(payload));
  };
  if (Sync.mode === 'sdk' && Sync.ref && window.firebase && window.firebase.database) {
    try { Sync.ref.set(payload).then(() => done(true)).catch(() => done(false)); } catch (e) { done(false); }
    return;
  }
  if (Sync.mode === 'rest') restPut(payload).then(() => done(true)).catch(() => done(false));
}
function restURL() { return SYNC_FB.databaseURL + '/rooms/' + encodeURIComponent(Sync.room) + '.json'; }
async function restGet() {
  const r = await fetch(restURL(), {cache: 'no-store'});
  if (!r.ok) throw new Error('http ' + r.status);
  const t = await r.text();
  return t && t.trim() ? JSON.parse(t) : null;
}

  const r = await fetch(restURL(), {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
  if (!r.ok) throw new Error('http ' + r.status);
  return true;
}
async function restDelete() {
  const r = await fetch(restURL(), {method: 'DELETE'});

  return true;
}

function loadScript(src) {

/* ---------- 바이트/데이터URL ---------- */
function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function bytesToB64(u8) {
  let s = '';
  const CH = 0x8000;
  for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
  return btoa(s);
}
function dataURLToBytes(durl) {
  const i = String(durl || '').indexOf(',');
  if (i < 0) return new Uint8Array(0);
  return b64ToBytes(String(durl).slice(i + 1));
}
function bytesToDataURL(u8, mime) { return 'data:' + (mime || 'application/octet-stream') + ';base64,' + bytesToB64(u8); }
function readAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result || ''));
    fr.onerror = () => reject(new Error('read'));
    fr.readAsDataURL(file);
  });
}
function blobToDataURL(blob) { return readAsDataURL(blob); }

/* ---------- 사진: 800px 이하로 줄이고 가볍게 ---------- */
function webpOK() {
  try {
    const c = document.createElement('canvas');
    c.width = c.height = 1;
    return c.toDataURL('image/webp').indexOf('data:image/webp') === 0;
  } catch (e) { return false; }
}
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const max = 800;
      let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      if (!w || !h) { reject(new Error('image')); return; }
      const scale = Math.min(1, max / Math.max(w, h));
      w = Math.max(1, Math.round(w * scale)); h = Math.max(1, Math.round(h * scale));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      const mime = webpOK() ? 'image/webp' : 'image/jpeg';
      const tryQ = (q) => cv.toDataURL(mime, q);
      let data = tryQ(0.72);
      if (data.length > 330000) data = tryQ(0.6);
      if (data.length > 260000) data = tryQ(0.5);
      resolve({data, mime, w, h, size: dataURLToBytes(data).length});
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}

function downloadBlob(blob, name) {

function fileSafe(name, fallback) {

    .replace(/[\\/:*?"<>|\n\r\t]/g, '_')
    .replace(/\s+/g, ' ')
    .trim()

function extOf(m) {

/* ---------- ZIP (내장 순수 JS, 외부 라이브러리 없음) ---------- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }

})();

  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function dosParts(d) {

    t: (d.getHours() << 11) | (d.getMinutes() << 5) | Math.floor(d.getSeconds() / 2),
    d: ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate(),

function zipBuild(files) {
  const enc = new TextEncoder();

    const name = enc.encode(f.name);
    const data = f.data instanceof Uint8Array ? f.data : new Uint8Array(f.data || 0);
    const crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);     /* UTF-8 파일명 */
    lh.setUint16(8, 0, true);          /* stored */

    lh.setUint16(12, dp.d, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true);
    lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true);
    lh.setUint16(28, 0, true);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true);
    cd.setUint16(6, 20, true);
    cd.setUint16(8, 0x0800, true);
    cd.setUint16(10, 0, true);
    cd.setUint16(12, dp.t, true);
    cd.setUint16(14, dp.d, true);
    cd.setUint32(16, crc, true);
    cd.setUint32(20, data.length, true);
    cd.setUint32(24, data.length, true);
    cd.setUint16(28, name.length, true);
    cd.setUint16(30, 0, true);
    cd.setUint16(32, 0, true);
    cd.setUint16(34, 0, true);
    cd.setUint16(36, 0, true);
    cd.setUint32(38, 0, true);
    cd.setUint32(42, offset, true);
    central.push(new Uint8Array(cd.buffer), name);

    offset += 30 + name.length + data.length;
  });

  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true);
  end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true);

async function zipParse(input) {
  const buf = input instanceof ArrayBuffer ? input : await input.arrayBuffer();
  const u8 = new Uint8Array(buf);
  const dv = new DataView(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('zip 아님');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const out = {};
  for (let i = 0; i < count; i++) {
    if (p + 46 > u8.length || dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true);
    const elen = dv.getUint16(p + 30, true);
    const clen = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nlen));
    const lnlen = dv.getUint16(lho + 26, true);
    const lelen = dv.getUint16(lho + 28, true);
    const start = lho + 30 + lnlen + lelen;
    const raw = u8.subarray(start, start + csize);
    let data;
    if (method === 0) data = raw;
    else if (method === 8 && typeof DecompressionStream !== 'undefined') {
      const ab = await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
      data = new Uint8Array(ab);
    } else throw new Error('압축 방식 지원 안 됨(' + method + ')');
    if (!name.endsWith('/')) out[name] = data;
    p += 46 + nlen + elen + clen;
  }
  return out;
}

/* ---------- 모아보기 ---------- */
function groupPeriods(mode) {
  const map = {};
  sortRecords(state.records).forEach(r => {
    const d = parseDay(r.date);
    if (!d) return;
    let key, label, order;
    if (mode === 'year') {
      key = String(d.getFullYear()); label = d.getFullYear() + '년'; order = key;
    } else if (mode === 'semester') {
      const y = d.getFullYear(), m = d.getMonth() + 1;
      if (m >= 3 && m <= 8) { key = y + '-H1'; label = y + '학년도 1학기 (3~8월)'; order = y + '-1'; }
      else if (m >= 9) { key = y + '-H2'; label = y + '학년도 2학기 (9~2월)'; order = y + '-2'; }
      else { key = (y - 1) + '-H2'; label = (y - 1) + '학년도 2학기 (9~2월)'; order = (y - 1) + '-2'; }
    } else {
      key = r.date.slice(0, 7); label = ymdLabel(d); order = key;
    }
    if (!map[key]) map[key] = {key, label, order, records: []};
    map[key].records.push(r);
  });
  return Object.keys(map).map(k => map[k]).sort((a, b) => b.order < a.order ? -1 : b.order > a.order ? 1 : 0);
}
function ymdLabel(d) { return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월'; }

function saveRecord() {
  const say = formVal('fSay').trim();
  const note = formVal('fNote').trim();
  const title = formVal('fTitle').trim();
  const date = parseDay(formVal('fDate')) ? formVal('fDate') : dayKey();
  if (!title && !say && !note && !FORM.media.length) {
    toast('사진 한 장이나 한 줄만 있어도 저장할 수 있어요.');
    return;
  }
  const draft = {
    title: title || autoTitle({date, type: FORM.type}),
    date, type: FORM.type, topics: FORM.topics.slice(),
    childSay: say, parentNote: note, helped: FORM.helped,
    media: FORM.media.map(m => Object.assign({}, m)),
  };
  if (FORM.editId) {
    const r = state.records.find(x => x.id === FORM.editId);
    if (!r) return;
    Object.assign(r, draft, {updatedAt: Date.now()});
    const fixed = sanitizeRecord(r);
    if (fixed) Object.assign(r, fixed);
    save();
    closeAllSheets();
    render();
    toast('기록을 고쳤어요.');
    return;
  }
  const rec = sanitizeRecord(Object.assign({id: uid('rec'), versions: [], fav: false, later: false, createdAt: Date.now()}, draft));
  if (!rec) { toast('저장하지 못했어요. 내용을 확인해 주세요.'); return; }
  state.records.push(rec);
  save();
  closeAllSheets();
  go('home');
  toast('기록을 남겼어요' + (state.profile.childName ? '' : ' · 설정에서 아이 이름을 넣으면 나이별로 모여요'));
}

    id: uid('ver'), date: parseDay(formVal('vDate')) ? formVal('vDate') : dayKey(),
    childSay: say, note, media: FORM.media.map(m => Object.assign({}, m)), at: Date.now(),
  });

  return '<a href="' + m.data + '" download="' + esc(m.name) + '" style="display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:800;color:var(--blue);background:var(--blue-soft);border-radius:9px;padding:7px 10px">📄 ' + esc(m.name) + ' <span class="hint">' + bytesText(m.size) + '</span></a>';

async function renameTopic(oldName) {
  const name = await askText('주제 이름 정리', '새 이름 (같은 이름이 있으면 합쳐져요)', oldName, '예: 로봇·기계');
  if (name == null) return;
  const t = cleanTopic(name);
  if (!t) { toast('이름을 입력해 주세요.'); return; }
  let changed = 0;
  state.records.forEach(r => {
    const ts = topicsOf(r);
    if (ts.some(x => x.toLowerCase() === oldName.toLowerCase())) {
      const next = ts.filter(x => x.toLowerCase() !== oldName.toLowerCase());
      if (next.map(x => x.toLowerCase()).indexOf(t.toLowerCase()) < 0) next.push(t);
      r.topics = next;
      r.updatedAt = Date.now();
      changed++;
    }
  });
  save();
  closeAllSheets();
  render();
  toast(changed + '건의 주제를 "' + t + '"로 정리했어요.');
}

}

  return '\uFEFF' + head.map(csvCell).join(',') + '\n' + rows.join('\n');
}
function docsCsv() {

  return '\uFEFF' + head.map(csvCell).join(',') + '\n' + rows.join('\n');
}

function archiveMd(data) {
  const who = (data.child && data.child.childName) || '우리 아이';
  const out = ['# ' + who + ' 성장 기록', '', '- 내보낸 날: ' + data.exportedAt, '- 기록 ' + arr(data.records).length + '건 · 서류 ' + arr(data.docs).length + '건', '- 가족 작성 자료(평가·점수·공식 증빙 아님)', ''];
  arr(data.records).forEach(r => {
    out.push('## ' + (r.title || r.date));
    out.push('');
    out.push('- 날짜: ' + r.date + ' · 유형: ' + r.type + (arr(r.topics).length ? ' · 주제: ' + arr(r.topics).map(t => '#' + t).join(' ') : ''));
    if (r.childSay) { out.push(''); out.push('> 아이 말 그대로'); out.push('> ' + String(r.childSay).replace(/\n/g, '\n> ')); }
    if (r.parentNote) { out.push(''); out.push('**부모 메모** · ' + String(r.parentNote).replace(/\n/g, ' ')); }
    const imgs = arr(r.media).filter(m => m.kind === 'image' && m.path);
    if (imgs.length) { out.push(''); imgs.forEach(m => out.push('![' + (m.name || '사진') + '](' + String(m.path).replace(/^[^/]+\//, '') + ')')); }
    const files = arr(r.media).filter(m => m.kind !== 'image' && m.path);
    if (files.length) { out.push(''); out.push('첨부: ' + files.map(m => '[' + m.name + '](' + String(m.path).replace(/^[^/]+\//, '') + ')').join(', ')); }
    if (arr(r.versions).length) {
      out.push('');
      out.push('**이어쓰기 ' + arr(r.versions).length + '번**');
      arr(r.versions).forEach((v, i) => out.push((i + 1) + '. ' + v.date + (v.childSay ? ' — “' + v.childSay + '”' : '') + (v.note ? ' (' + v.note + ')' : '')));
    }
    out.push('');
  });
  if (arr(data.docs).length) {

    });
  }
  return out.join('\n');
}

function exportBaseName() { return 'growth-archive-' + dayKey().replace(/-/g, ''); }

async function exportZip() {
  const base = exportBaseName();
  toast('ZIP을 만드는 중이에요…', 1800);
  await new Promise(r => setTimeout(r, 30));
  const files = [];
  let attachCount = 0;
  const data = {
    app: 'growth-archive', appVersion: APP_VERSION, format: 1,
    exportedAt: new Date().toISOString(),
    child: {childName: state.profile.childName, birthDate: state.profile.birthDate},
    note: '가족 작성 자료 · 가족이 직접 남긴 기록의 사본',
    records: [], docs: [],
  };
  const pushMedia = (m, dir, prefix) => {
    const p = base + '/' + dir + '/' + prefix + '-' + fileSafe(m.name, 'file') + '.' + extOf(m);
    const out = Object.assign({}, m, {path: p});
    delete out.data;
    if (m.data) { files.push({name: p, data: dataURLToBytes(m.data)}); attachCount++; }
    return out;
  };
  state.records.forEach(r => {
    const rec = Object.assign({}, r);
    delete rec.versions;
    rec.media = arr(r.media).map((m, i) => pushMedia(m, 'attachments', r.id + '/' + (i + 1)));
    rec.versions = arr(r.versions).map((v, vi) => {
      const cv = Object.assign({}, v);
      cv.media = arr(v.media).map((m, i) => pushMedia(m, 'attachments', r.id + '/v' + (vi + 1) + '-' + (i + 1)));
      return cv;
    });
    data.records.push(rec);
  });
  state.docs.forEach(d => {
    const doc = Object.assign({}, d);
    doc.media = arr(d.media).map((m, i) => pushMedia(m, 'docs', d.id + '/' + (i + 1)));
    data.docs.push(doc);
  });
  const enc = new TextEncoder();
  files.push({name: base + '/data.json', data: enc.encode(JSON.stringify(data, null, 2))});
  files.push({name: base + '/records.csv', data: enc.encode(recordsCsv())});
  files.push({name: base + '/documents.csv', data: enc.encode(docsCsv())});
  files.push({name: base + '/archive.html', data: enc.encode(archiveHtml(data, base))});
  files.push({name: base + '/archive.md', data: enc.encode(archiveMd(data))});
  files.push({name: base + '/README.md', data: enc.encode(readmeMd(data, base))});
  const blob = zipBuild(files);
  downloadBlob(blob, base + '.zip');
  toast('ZIP 백업을 만들었어요 · 파일 ' + files.length + '개 · 첨부 원본 ' + attachCount + '개 (' + bytesText(blob.size) + ')', 4200);
}

function guessMime(ext) {
  return ({jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', gif: 'image/gif', webm: 'audio/webm', mp3: 'audio/mpeg', m4a: 'audio/mp4', pdf: 'application/pdf'}[String(ext || '').toLowerCase()]) || 'application/octet-stream';
}
async function restoreFrom(file) {
  let dataObj = null;
  let entries = null;
  if (/\.zip$/i.test(file.name) || file.type === 'application/zip') {
    entries = await zipParse(file);
    const key = Object.keys(entries).find(k => /(^|\/)data\.json$/.test(k));
    if (!key) throw new Error('ZIP 안에 data.json이 없어요');
    dataObj = JSON.parse(new TextDecoder().decode(entries[key]));
  } else {
    const text = await file.text();
    dataObj = JSON.parse(text);
  }
  const pack = dataObj && dataObj.data ? dataObj.app === 'growth-archive' || dataObj.format ? dataObj.data : dataObj : dataObj;
  const incoming = sanitize({
    profile: pack.profile || (dataObj && dataObj.child ? {childName: dataObj.child.childName, birthDate: dataObj.child.birthDate} : {}),
    settings: pack.settings || {},
    records: arr(pack.records), docs: arr(pack.docs), updatedAt: Date.now(),
  });
  if (entries) {
    const inline = m => {
      if (!m || !m.path) return m;
      const bytes = entries[m.path] || entries[Object.keys(entries).find(k => k.endsWith('/' + String(m.path).split('/').slice(-2).join('/'))) || ''];
      if (!bytes) return null;
      const ext = /\.([A-Za-z0-9]{1,6})$/.exec(m.path);
      const mm = Object.assign({}, m, {data: bytesToDataURL(bytes, guessMime(ext ? ext[1] : ''))});
      delete mm.path;
      return mm;
    };
    incoming.records.forEach(r => {
      r.media = arr(r.media).map(inline).filter(Boolean);
      arr(r.versions).forEach(v => { v.media = arr(v.media).map(inline).filter(Boolean); });
    });
    incoming.docs.forEach(d => { d.media = arr(d.media).map(inline).filter(Boolean); });
  }
  const haveR = {}, haveD = {};
  state.records.forEach(r => { haveR[r.id] = 1; });
  state.docs.forEach(d => { haveD[d.id] = 1; });
  const newR = incoming.records.filter(r => !haveR[r.id]);
  const dupR = incoming.records.length - newR.length;
  const newD = incoming.docs.filter(d => !haveD[d.id]);
  const dupD = incoming.docs.length - newD.length;
  const attCount = incoming.records.reduce((n, r) => n + arr(r.media).length + arr(r.versions).reduce((k, v) => k + arr(v.media).length, 0), 0) + incoming.docs.reduce((n, d) => n + arr(d.media).length, 0);
  const who = incoming.profile.childName || (dataObj.child && dataObj.child.childName) || '';
  const html =
    '<div class="hint" style="margin-bottom:10px">' + (who ? esc(who) + '의 기록 · ' : '') + '파일에서 찾은 내용이에요. 먼저 무엇이 새로 들어오는지 확인하세요.</div>' +
    '<div style="background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px">' +
      '<div class="restore-item">📝 기록 <b>총 ' + incoming.records.length + '건</b><span class="cnt" style="color:var(--accent)">새로 ' + newR.length + ' · 중복 ' + dupR + '</span></div>' +
      '<div class="restore-item">📁 서류 <b>총 ' + incoming.docs.length + '건</b><span class="cnt" style="color:var(--accent)">새로 ' + newD.length + ' · 중복 ' + dupD + '</span></div>' +
      '<div class="restore-item">📎 첨부 파일 <b>' + attCount + '개</b><span class="cnt"></span></div>' +
      '<div class="restore-item" style="color:var(--ink-3)">지금 이 기기: 기록 ' + state.records.length + '건 · 서류 ' + state.docs.length + '건</div>' +
    '</div>' +
    '<p class="hint" style="margin-top:10px"><b>새 항목만 병합</b>은 같은 ID의 기록을 건너뛰고 새 기록·서류만 더해요. <b>전체 덮어쓰기</b>는 이 기기의 기록·서류를 파일 내용으로 바꿉니다(되돌릴 수 없어요).</p>' +
    '<div class="sheet-foot" style="flex-direction:column">' +
      '<button class="btn" data-act="doMerge" style="width:100%">새 항목만 병합 (' + (newR.length + newD.length) + '건)</button>' +
      '<div style="display:flex;gap:8px;width:100%"><button class="btn ghost" data-act="doRestoreAll" style="flex:1">전체 덮어쓰기</button>' +
      '<button class="btn ghost" data-act="closeSheet" style="flex:1">취소</button></div>' +
    '</div>';
  window.__restore = {incoming, newR, newD};
  openSheet(html, {title: '복원 미리보기', center: true});
}
function doMerge() {

  if (!state.profile.childName && rd.incoming.profile.childName) state.profile.childName = rd.incoming.profile.childName;
  if (!state.profile.birthDate && rd.incoming.profile.birthDate) state.profile.birthDate = rd.incoming.profile.birthDate;

async function doRestoreAll() {

  if (!ok) return;
  const keepR = {}, keepD = {};
  rd.incoming.records.forEach(r => { keepR[r.id] = 1; });
  rd.incoming.docs.forEach(d => { keepD[d.id] = 1; });
  state.records.forEach(r => { if (!keepR[r.id]) state.deleted.records[r.id] = Date.now(); });
  state.docs.forEach(d => { if (!keepD[d.id]) state.deleted.docs[d.id] = Date.now(); });
  state.records = rd.incoming.records;
  state.docs = rd.incoming.docs;
  if (rd.incoming.profile.childName) state.profile.childName = rd.incoming.profile.childName;
  if (rd.incoming.profile.birthDate) state.profile.birthDate = rd.incoming.profile.birthDate;

  go('home');
  toast('파일 내용으로 복원했어요.');
